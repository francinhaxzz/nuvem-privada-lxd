server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;
    location /api/ {
        proxy_pass http://10.10.10.11:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
